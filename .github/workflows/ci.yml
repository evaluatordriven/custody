name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fixtures are up to date
        run: python3 fixtures/generate.py && git diff --exit-code fixtures/ && test -z "$(git status --porcelain fixtures/)"
      - name: Checker matches every fixture
        run: python3 tests/run_fixtures.py
      - name: Quickstart works, standard library only
        run: |
          python3 tools/make_record.py examples/minimal/inputs.json examples/minimal/record.json
          python3 checker/check.py examples/minimal/record.json --files examples/minimal --bar examples/minimal/bar.md --evidence examples/minimal/evidence
      - name: The committed example record is the one the quickstart builds
        run: git diff --exit-code examples/
      - name: Custody log is tamper-evident and builds a valid record
        run: python3 tests/log_check.py
      - name: Record tools refuse malformed events and unfiled declarations
        run: python3 tests/record_tools_check.py
      - name: Size limits and cross-file agreement
        run: python3 tools/count.py && python3 tests/red_counts.py
      - name: Third-party JSON Schema 2020-12 validation (schema and checker agree)
        run: |
          pip install "jsonschema==4.26.0" "check-jsonschema==0.38.2"
          check-jsonschema --check-metaschema schema/custody-v1.schema.json
          python3 tests/schema_check.py
      - name: Plain view describes every record
        run: python3 tests/explain_check.py
      - name: Published notes copy the checker's words
        run: python3 tests/verify_note_check.py
      - name: No cache files written into the repository
        run: test -z "$(find . -name __pycache__ -not -path './.git/*')"
      - name: Reviewer's guide reading level (advisory, not a gate)
        continue-on-error: true
        run: |
          pip install "textstat==0.7.13"
          python3 -m nltk.downloader cmudict
          python3 tools/readability.py
          python3 tests/red_readability.py
